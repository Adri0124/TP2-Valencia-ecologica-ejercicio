<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Laboratorio: Registro por Especie</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f4; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; background: #e8f5e9; padding: 15px; border-radius: 8px; flex-wrap: wrap; }
        input { padding: 8px; width: 80px; }
        button { padding: 8px 15px; background: #2e7d32; color: white; border: none; border-radius: 4px; cursor: pointer; }
        
        .tablas-container { display: flex; gap: 20px; margin-top: 20px; }
        .especie-box { flex: 1; border: 2px solid #ccc; border-radius: 8px; padding: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { border: 1px solid #ccc; padding: 5px; text-align: center; }
        th { background: #f1f8e9; }
        
        canvas { background: #fff; border: 1px solid #ddd; display: block; width: 100%; height: auto; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h3>Registro de Supervivencia por Especie</h3>
    <div class="input-group">
        <label>Temp (°C):</label>
        <input type="number" id="temp" value="12">
        <label>% Sup:</label>
        <input type="number" id="sup" placeholder="Ej: 22">
        <select id="especie">
            <option value="assimile">A. assimile</option>
            <option value="dorsale">A. dorsale</option>
            <option value="mulleri">A. mulleri</option>
        </select>
        <button onclick="agregarDato()">Graficar dato</button>
        <button onclick="limpiar()" style="background:#c62828;">Limpiar</button>
    </div>

    <div class="tablas-container">
        <div class="especie-box" id="box-assimile"><h4>A. assimile</h4><table id="tabla-assimile"><thead><tr><th>T°</th><th>%</th></tr></thead><tbody></tbody></table></div>
        <div class="especie-box" id="box-dorsale"><h4>A. dorsale</h4><table id="tabla-dorsale"><thead><tr><th>T°</th><th>%</th></tr></thead><tbody></tbody></table></div>
        <div class="especie-box" id="box-mulleri"><h4>A. mulleri</h4><table id="tabla-mulleri"><thead><tr><th>T°</th><th>%</th></tr></thead><tbody></tbody></table></div>
    </div>

    <canvas id="grafico" width="800" height="400"></canvas>
</div>

<script>
    let datos = { assimile: [], dorsale: [], mulleri: [] };
    let colores = { assimile: "#1976d2", dorsale: "#388e3c", mulleri: "#d32f2f" };

    function agregarDato() {
        let t = parseFloat(document.getElementById('temp').value);
        let s = parseFloat(document.getElementById('sup').value);
        let e = document.getElementById('especie').value;
        if (!isNaN(t) && !isNaN(s)) {
            datos[e].push({x: t, y: s});
            actualizarTodo();
        }
    }

    function actualizarTodo() {
        for(let esp in datos) { 
            datos[esp].sort((a,b) => a.x - b.x); 
            let tbody = document.getElementById('tabla-'+esp).getElementsByTagName('tbody')[0];
            tbody.innerHTML = "";
            datos[esp].forEach(p => {
                let fila = tbody.insertRow();
                fila.insertCell(0).innerText = p.x;
                fila.insertCell(1).innerText = p.y;
            });
        }
        dibujar();
    }

    function limpiar() { datos = { assimile: [], dorsale: [], mulleri: [] }; actualizarTodo(); }

    function dibujar() {
        const canvas = document.getElementById('grafico');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Ejes
        ctx.strokeStyle = "#333"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(50, 350); ctx.lineTo(750, 350); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(50, 50); ctx.lineTo(50, 350); ctx.stroke();

        for (let esp in datos) {
            ctx.strokeStyle = colores[esp]; ctx.fillStyle = colores[esp];
            ctx.lineWidth = 3;
            ctx.beginPath();
            datos[esp].forEach((p, i) => {
                let px = 50 + (p.x - 10) * 20;
                let py = 350 - p.y * 10;
                if(i==0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            });
            ctx.stroke();
            datos[esp].forEach(p => {
                let px = 50 + (p.x - 10) * 20;
                let py = 350 - p.y * 10;
                ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
            });
        }
    }
</script>
</body>
</html>
