<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Grafico de Supervivencia</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f4; padding: 20px; }
        .container { max-width: 850px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; background: #e8f5e9; padding: 15px; border-radius: 8px; }
        input { padding: 8px; width: 80px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; background: #2e7d32; color: white; border: none; border-radius: 4px; cursor: pointer; }
        canvas { background: #fff; border-bottom: 2px solid #333; border-left: 2px solid #333; display: block; width: 100%; height: auto; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h3>Carga de datos: Supervivencia vs Temperatura</h3>
    <div class="input-group">
        <input type="number" id="temp" placeholder="Temp °C">
        <input type="number" id="sup" placeholder="% Sup">
        <select id="especie">
            <option value="assimile">A. assimile</option>
            <option value="dorsale">A. dorsale</option>
            <option value="mulleri">A. mulleri</option>
        </select>
        <button onclick="agregarDato()">Agregar Dato</button>
        <button onclick="limpiar()" style="background:#c62828;">Limpiar</button>
    </div>

    <canvas id="grafico" width="800" height="400"></canvas>
</div>

<script>
    let datos = { assimile: [], dorsale: [], mulleri: [] };

    function agregarDato() {
        let t = parseFloat(document.getElementById('temp').value);
        let s = parseFloat(document.getElementById('sup').value);
        let e = document.getElementById('especie').value;
        if (!isNaN(t) && !isNaN(s)) {
            datos[e].push({x: t, y: s});
            datos[e].sort((a,b) => a.x - b.x);
            dibujar();
        }
    }

    function limpiar() { datos = { assimile: [], dorsale: [], mulleri: [] }; dibujar(); }

    function dibujar() {
        const canvas = document.getElementById('grafico');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Dibujar ejes simples (simplificado para el ejemplo)
        ctx.strokeStyle = "#333"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(50, 350); ctx.lineTo(750, 350); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(50, 50); ctx.lineTo(50, 350); ctx.stroke();

        let colores = { assimile: "#1976d2", dorsale: "#388e3c", mulleri: "#d32f2f" };

        for (let esp in datos) {
            ctx.strokeStyle = colores[esp]; ctx.lineWidth = 3;
            ctx.beginPath();
            datos[esp].forEach((p, i) => {
                let px = 50 + (p.x - 10) * 20;
                let py = 350 - p.y * 10;
                if(i==0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            });
            ctx.stroke();
        }
    }
</script>
</body>
</html>
